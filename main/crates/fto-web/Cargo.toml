[package]
name = "fto-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Compile the shared command handlers as an rlib only. Tauri's native
# staticlib/cdylib outputs must not be linked as Emscripten side modules.
[lib]
name = "fto_web_backend"
path = "../../src-tauri/src/lib.rs"

[features]
default = ["browser"]
browser = []
gpu = ["fto-core/gpu"]

[dependencies]
fto-core = { path = "../fto-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-executor = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("desktop"))'] }
